<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orla Browser</title>
  <link rel="stylesheet" href="orla.css">
  <script type="module" src="browser.js"></script>
</head>
<body>
  <header class="toolbar" aria-label="Navegação">
    <button id="tabs-toggle" class="icon" aria-label="Abas" aria-controls="tab-dialog" aria-haspopup="dialog"><img src="assets/tabs.svg" alt=""></button>
    <div class="navigation">
      <button class="icon" data-tab-action="back" aria-label="Voltar"><img src="assets/back.svg" alt=""></button>
      <button class="icon" data-tab-action="forward" aria-label="Avançar"><img src="assets/next.svg" alt=""></button>
      <button class="icon" data-tab-action="reload" aria-label="Recarregar"><img src="assets/reload.svg" alt=""></button>
    </div>
    <button id="address" class="address" aria-haspopup="dialog"><img src="assets/search.svg" alt=""><span>Pesquisar ou digitar endereço</span><kbd>Ctrl+L</kbd></button>
    <button id="new-tab" class="icon" aria-label="Nova aba"><img src="assets/plus.svg" alt=""></button>
    <button id="agent" aria-haspopup="dialog">Agente</button>
    <div class="window-actions" aria-label="Controles da janela">
      <button class="icon" data-window-action="minimize" aria-label="Minimizar"><img src="assets/min.svg" alt=""></button>
      <button class="icon" data-window-action="maximize" aria-label="Maximizar ou restaurar"><img src="assets/max.svg" alt=""></button>
      <button class="icon" data-window-action="close" aria-label="Fechar janela"><img src="assets/close.svg" alt=""></button>
    </div>
  </header>
  <main id="home">
    <div class="home-content">
      <h1>Nova aba</h1>
      <button id="home-search" class="address featured" aria-haspopup="dialog"><img src="assets/search.svg" alt="">Buscar na web <span aria-hidden="true">↵</span></button>
      <nav class="favorites" aria-label="Favoritos">
        <p>Favoritos</p>
        <div>
          <button data-url="https://github.com/">GitHub</button>
          <button data-url="https://developer.mozilla.org/">MDN Web Docs</button>
          <button data-url="https://www.figma.com/">Figma</button>
        </div>
      </nav>
    </div>
  </main>
  <p id="status" role="status" hidden></p>
  <dialog id="search-dialog" aria-label="Pesquisar ou digitar endereço">
    <form id="search-form">
      <label for="query">Pesquisar ou digitar endereço</label>
      <input id="query" type="text" autofocus autocomplete="off" spellcheck="false">
      <button class="primary" type="submit">Abrir <kbd>Enter</kbd></button>
      <button type="button" data-dismiss>Cancelar</button>
    </form>
    <p>As pesquisas são enviadas ao DuckDuckGo.</p>
  </dialog>
  <dialog id="tab-dialog" aria-labelledby="tab-heading">
    <div class="dialog-heading"><h2 id="tab-heading">Abas</h2><button id="add-tab">Nova aba</button></div>
    <ul id="tab-list"></ul>
    <button data-dismiss>Fechar</button>
  </dialog>
  <dialog id="agent-dialog" aria-labelledby="agent-heading">
    <h2 id="agent-heading">Agente</h2>
    <p>O envio de conteúdo a modelos está desativado nesta versão.</p>
    <button data-dismiss>Voltar</button>
  </dialog>
</body>
</html>
